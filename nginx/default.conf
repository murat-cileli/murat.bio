server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    ssi on;
    ssi_types text/html;
    ssi_silent_errors off;

    error_page 404 /404.html;

    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    location /includes/ {
        internal;
    }
}
